{% extends "base.html" %}

{% block title %}Delete Post | Django Blog{% endblock %}

{% block content %}
<h1>Delete post</h1>
<p>Are you sure you want to delete “{{ object.title }}”? This cannot be undone.</p>
<form method="post" class="form">
    {% csrf_token %}
    <button type="submit" class="button-danger">Yes, delete</button>
    <a class="button-link" href="{{ object.get_absolute_url }}">Cancel</a>
</form>
{% endblock %}
